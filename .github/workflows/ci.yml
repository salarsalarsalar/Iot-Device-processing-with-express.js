name: CI - IoT Microservices

on:
  push:
    branches: [ Docker_CI-CD ]
  pull_request:
    branches: [ Docker_CI-CD ]
# On any branch
# on:
#   push:
#     branches:
#       - '**'  # Triggers on push to any branch
#   pull_request:
#     branches:
#       - '**'  # Triggers on PR to any branch

jobs:
  install-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Setup Node.js for API Gateway and other Node.js services
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Install dependencies for Node.js services
    - name: Install API Gateway dependencies
      working-directory: ./api-gateway
      run: |
        npm ci
        npm run test
    
    - name: Install User Service dependencies
      working-directory: ./user-service
      run: |
        npm ci
        npm run test

    - name: Install IoT Service dependencies
      working-directory: ./iot-service
      run: |
        npm ci
        npm run test

    # Setup Python for data processing service
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Install dependencies for Python services
    - name: Install Data Processing Service dependencies
      working-directory: ../data-processing-service
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt