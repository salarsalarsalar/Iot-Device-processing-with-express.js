name: CI/CD - IoT Microservices with Docker

on:
  push:
    branches: [ Docker_CI-CD ]
  pull_request:
    branches: [ Docker_CI-CD ]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
  IMAGE_TAG: latest

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # --- Run tests for Node.js microservices ---
    - name: Install & Test API Gateway
      working-directory: ./api-gateway
      run: |
        npm ci
        npm test

    - name: Install & Test User Service
      working-directory: ./user-service
      run: |
        npm ci
        npm test

    - name: Install & Test IoT Service
      working-directory: ./iot-service
      run: |
        npm ci
        npm test

    # Optional: Add Python service tests here

    # --- Build Docker images ---
    - name: Log in to Docker Hub
      run: echo "${DOCKER_HUB_PASSWORD}" | docker login -u "${DOCKER_HUB_USERNAME}" --password-stdin

    - name: Build Docker images
      run: |
        docker build -t $DOCKER_HUB_USERNAME/api-gateway:$IMAGE_TAG -f ./api-gateway/gateway.dockerfile ./api-gateway
        docker build -t $DOCKER_HUB_USERNAME/user-service:$IMAGE_TAG -f ./user-service/user.dockerfile ./user-service
        docker build -t $DOCKER_HUB_USERNAME/iot-service:$IMAGE_TAG -f ./iot-service/iot.dockerfile ./iot-service

    - name: Push Docker images to Docker Hub
      run: |
        docker push $DOCKER_HUB_USERNAME/api-gateway:$IMAGE_TAG
        docker push $DOCKER_HUB_USERNAME/user-service:$IMAGE_TAG
        docker push $DOCKER_HUB_USERNAME/iot-service:$IMAGE_TAG

  # Optional: integration testing with docker-compose
  integration-test:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Start services with Docker Compose
      run: |
        docker-compose up -d
        sleep 20  # Wait for services to stabilize
        docker ps

    - name: Run health check
      run: curl --fail https://localhost:${{ secrets.API_GATEWAY_PORT }}/api/welcome

    - name: Shut down containers
      run: docker-compose down
